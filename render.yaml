services:
  - type: web
    name: saeindia-relay-server
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: RELAY_TOKEN
        generateValue: true
      - key: NODE_ENV
        value: production
